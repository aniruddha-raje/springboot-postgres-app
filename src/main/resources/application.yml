# PostgreSQL Database Configuration
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/twitter
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  # Hibernate Configuration
  jpa:
    # Don't keep a DB session open during response rendering. The repositories'
    # entity graphs load everything the API serializes, so nothing needs it.
    open-in-view: false
    properties:
      hibernate:
        # The Postgres dialect is detected from the connection automatically.
        format_sql: true
    hibernate:
      # 'validate' only checks that the schema matches the entities; it never
      # mutates the schema. The tables must already exist before startup, e.g.:
      #   createdb twitter
      #   (create the app_user, profile, post, role and user_role tables)
      # To let Hibernate auto-create the schema for a quick local spin-up,
      # temporarily switch this back to 'update'.
      ddl-auto: validate
#    show-sql: true

# External integration (JSONPlaceholder /posts)
app:
  jsonPlaceholderUrl: https://jsonplaceholder.typicode.com/posts

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,mappings

# Logging Configuration
logging:
  level:
    org:
      springframework:
        web: info
